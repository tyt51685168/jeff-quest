<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Jeff Tu 的像素 RPG 履歷：走過台科大、勤業眾信、遠傳與胡志明市，收集 7 枚徽章。A pixel RPG résumé of data analyst Jeff Tu.">
<meta property="og:title" content="Jeff Quest">
<meta property="og:description" content="A 5–10 minute pixel RPG résumé of data analyst Jeff Tu.">
<meta name="theme-color" content="#0b0c1c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%2315173a'/%3E%3Cpath fill='%23f2c14e' d='M7 2h2v3h3v2h-3v1h2v2h-2v4H7v-4H5V8h2V7H4V5h3z'/%3E%3C/svg%3E">
<title>Jeff Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --void:#0b0c1c; --win:#15173a; --win2:#20245a; --edge:#f4efe3; --ink:#f4efe3;
  --muted:#aeb0d4; --gold:#f2c14e; --teal:#3fb6a8; --rose:#e76f7a; --line:#3b3f7a;
  --pix:"DotGothic16","Noto Sans TC","PingFang TC","Microsoft JhengHei",monospace;
  --disp:"Pixelify Sans","DotGothic16","Noto Sans TC",monospace;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);overflow:hidden;color:var(--ink);font-family:var(--pix);-webkit-font-smoothing:none;}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:2px dashed var(--gold);outline-offset:3px}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#fade{position:absolute;inset:0;z-index:50;background:#000;opacity:0;pointer-events:none;transition:opacity .18s steps(4)}
#fade.on{opacity:1}
#fade.flash{background:#fff;transition:none}

/* battle */
#battle{position:absolute;inset:0;pointer-events:none}
.bbox{position:absolute;padding:8px 12px 10px;width:min(260px,56vw);font-size:15px}
#bMon{left:16px;top:calc(16px + env(safe-area-inset-top,0px))}
#bMe{right:16px;bottom:calc(200px + env(safe-area-inset-bottom,0px))}
body.touch #bMe{bottom:calc(360px + env(safe-area-inset-bottom,0px))}
.bbox .row2{display:flex;justify-content:space-between;gap:10px}
.hp{display:flex;align-items:center;gap:6px;margin-top:6px;font:700 11px var(--disp);color:var(--gold)}
.hp span{flex:1;height:10px;background:var(--void);border:2px solid var(--line);position:relative}
.hp i{position:absolute;left:0;top:0;bottom:0;width:100%;background:#6fe36f;transition:width .6s steps(8)}
.hp i.low{background:var(--rose)}

/* DQ-style window */
.win{background:var(--win);border:3px solid var(--edge);border-radius:8px;
  box-shadow:0 0 0 3px var(--void),inset 0 0 0 2px var(--win),inset 0 0 0 4px var(--line),0 8px 0 3px rgba(0,0,0,.35)}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;pointer-events:none}
#loc{font-size:clamp(13px,1.6vw,16px);padding:8px 14px;opacity:0;transform:translateY(-6px);transition:opacity .3s steps(3),transform .3s steps(3);max-width:60vw}
#loc.show{opacity:1;transform:none}
.hud-r{display:flex;gap:8px;pointer-events:auto}
.chip{font-size:14px;padding:7px 11px;background:var(--win);border:2px solid var(--edge);border-radius:6px;box-shadow:0 0 0 2px var(--void);line-height:1}
.chip:hover{background:var(--win2)}
.chip .star{color:var(--gold)}
.chip.pop{animation:pop .6s steps(3) 2}
@keyframes pop{50%{background:var(--gold);color:var(--void)}}
#bMusic[aria-pressed="true"]{color:var(--gold)}

/* dialog */
#dialog{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:min(780px,calc(100% - 32px));min-height:6.6em;padding:18px 22px 20px;font-size:clamp(15px,2vw,19px);line-height:1.65;cursor:pointer}
body.touch #dialog{bottom:calc(178px + env(safe-area-inset-bottom,0px))}
#dName{position:absolute;top:-17px;left:18px;background:var(--gold);color:#1b1530;padding:2px 12px;border:2px solid var(--void);border-radius:4px;font-size:.82em;letter-spacing:.04em}
#dName:empty{display:none}
#dText{white-space:pre-wrap;word-break:break-word}
#dNext{position:absolute;right:16px;bottom:8px;color:var(--gold);font-size:.8em;animation:bob .8s steps(2) infinite;visibility:hidden}
#dNext.on{visibility:visible}
@keyframes bob{50%{transform:translateY(3px)}}
#dChoices{display:flex;flex-direction:column;gap:2px;margin-top:8px}
#dChoices:empty{display:none}
.opt{text-align:left;padding:3px 8px 3px 26px;position:relative;border-radius:4px}
.opt.sel::before{content:"▶";position:absolute;left:6px;color:var(--gold);animation:blink .7s steps(2) infinite}
.opt:hover{background:var(--win2)}
@keyframes blink{50%{opacity:.2}}

/* menu */
#menu{position:absolute;right:16px;top:calc(60px + env(safe-area-inset-top,0px));min-width:210px;padding:14px 10px;font-size:17px}
#menu h2{font:700 13px var(--disp);letter-spacing:.2em;color:var(--muted);margin:0 0 6px 14px}
#menu .opt{display:block;width:100%;padding:6px 10px 6px 30px}

/* panel */
#panel{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(6,7,20,.72);padding:16px}
.panel-win{position:relative;width:min(820px,100%);max-height:calc(100% - 24px);overflow:auto;padding:26px clamp(18px,4vw,36px) 30px;
  font-size:16px;line-height:1.7;overscroll-behavior:contain;-webkit-user-select:text;user-select:text}
.panel-win .x{position:sticky;top:-10px;float:right;margin:-12px -14px 0 0;font-size:14px;padding:6px 10px;border:2px solid var(--edge);border-radius:6px;background:var(--win)}
.panel-win h2{font:700 clamp(24px,4vw,34px)/1.1 var(--disp);letter-spacing:.04em;margin:0 0 4px;color:var(--gold);text-wrap:balance}
.panel-win h3{font:700 15px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:26px 0 8px;display:flex;gap:10px;align-items:center}
.panel-win h3::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px)}
.panel-win p{margin:6px 0;max-width:68ch}
.eyebrow{font:700 12px var(--disp);letter-spacing:.24em;color:var(--muted);margin:0 0 6px}
.muted{color:var(--muted)}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.portrait{width:112px;height:112px;image-rendering:pixelated;background:var(--win2);border:2px solid var(--line);border-radius:6px;flex:none}
dl.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;flex:1;min-width:220px}
dl.stats dt{color:var(--muted);font-size:14px}
dl.stats dd{margin:0}
.traits{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.traits li{background:var(--win2);border:2px solid var(--line);border-radius:6px;padding:10px 12px}
.traits b{color:var(--gold);display:block;font-weight:400}
.skillgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.skill{border:2px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--win2)}
.skill h4{margin:0 0 6px;font-weight:400;display:flex;align-items:center;gap:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;padding:1px 8px;border:1px solid var(--muted);border-radius:3px}
.gem{display:inline-block;width:18px;height:18px;flex:none;background:var(--c,#555);clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),inset 3px 3px 0 rgba(255,255,255,.35)}
.gem.off{background:#3a3d63;box-shadow:none}
.badgelist{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.badgelist li{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:6px;padding:10px 12px}
.badgelist li.got{border-color:var(--gold)}
.badgelist small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.job{margin:14px 0 18px}
.job .top{display:flex;justify-content:space-between;gap:4px 16px;flex-wrap:wrap}
.job .role{color:var(--gold)}
.job .time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.job .lead{color:var(--muted);font-size:14px;margin:2px 0 4px}
.job ul{margin:4px 0 0;padding-left:1.2em}
.job li{margin:3px 0;max-width:72ch}
.job li::marker{content:"◆ ";color:var(--teal);font-size:.7em}
.contact{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.btn{display:inline-block;padding:8px 14px;border:2px solid var(--edge);border-radius:6px;background:var(--win2);text-decoration:none;color:var(--ink);font-size:15px}
.btn:hover{background:var(--gold);color:var(--void)}
.btn.primary{background:var(--gold);color:var(--void)}
code.mail{font-family:inherit;background:var(--void);padding:6px 10px;border-radius:4px;border:1px dashed var(--line)}
.chart{display:grid;gap:10px;margin:14px 0}
.bar{display:grid;grid-template-columns:5.5em 1fr 3.5em;gap:10px;align-items:center}
.bar .track{height:22px;background:var(--void);border:2px solid var(--line)}
.bar .fill{height:100%;background:repeating-linear-gradient(90deg,var(--c) 0 6px,color-mix(in srgb,var(--c) 70%,#000) 6px 8px)}
.bar .v{font-variant-numeric:tabular-nums;text-align:right}
.big{font:700 clamp(40px,8vw,64px)/1 var(--disp);color:var(--gold)}
.statline{display:flex;gap:24px;flex-wrap:wrap;margin:10px 0}
.statline div{display:flex;flex-direction:column}
.statline b{font:700 28px var(--disp);color:var(--teal);font-weight:700}

/* ending */
#ending{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:space-between;align-items:center;gap:12px;
  padding:calc(22px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));pointer-events:none}
#ending>*{pointer-events:auto}
#endHead{text-align:center;text-shadow:3px 3px 0 var(--void);animation:rise .6s steps(4) both}
#endHead .eyebrow{color:var(--teal);letter-spacing:.3em}
#endHead .big{margin:0;font-size:clamp(30px,6vw,56px);text-wrap:balance}
#endCard{width:min(760px,100%);max-height:58%;overflow:auto;padding:14px clamp(16px,3vw,26px) 16px;font-size:15px;line-height:1.6;
  animation:rise .6s steps(4) .9s both;-webkit-user-select:text;user-select:text}
#endCard p{margin:0 0 4px}
#endCard .statline{margin:6px 0 4px}
.endgems{display:flex;gap:3px;margin-top:4px}
.endgems .gem{width:13px;height:13px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

/* title */
#title{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at center,rgba(11,12,28,.78) 0%,rgba(11,12,28,.55) 45%,rgba(11,12,28,.3) 100%)}
.title-card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:560px}
.logo{margin:0;font:700 clamp(56px,13vw,124px)/.86 var(--disp);letter-spacing:.02em;color:var(--gold);
  text-shadow:4px 4px 0 #b3541e,8px 8px 0 var(--void);}
.logo span{display:block;color:var(--ink);text-shadow:4px 4px 0 var(--teal),8px 8px 0 var(--void)}
.sub{margin:10px 0 6px;font-size:clamp(15px,2.2vw,19px);text-shadow:2px 2px 0 var(--void)}
.title-menu{min-width:min(320px,100%);padding:14px 10px;display:flex;flex-direction:column;gap:2px;font-size:18px}
.title-menu .opt{padding:7px 10px 7px 32px}
.langsw{display:flex;gap:6px;justify-content:center;margin-top:8px;font-size:14px}
.langsw button{padding:4px 10px;border:2px solid var(--line);border-radius:4px}
.langsw button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.hint{font-size:13px;color:var(--muted);text-shadow:1px 1px 0 var(--void);margin:4px 0 0}

/* touch pad */
#pad{display:none;position:absolute;left:0;right:0;bottom:0;height:0}
body.touch #pad.on{display:block}
#dpad{position:absolute;left:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:138px;height:138px;border-radius:50%;
  background:rgba(21,23,58,.55);border:2px solid rgba(244,239,227,.5)}
#dpad i{position:absolute;width:44px;height:44px;background:rgba(244,239,227,.18);border:2px solid rgba(244,239,227,.6);border-radius:6px}
#dpad i.u{left:45px;top:4px}#dpad i.d{left:45px;bottom:4px}#dpad i.l{left:4px;top:45px}#dpad i.r{right:4px;top:45px}
#dpad i.on{background:var(--gold)}
.abtn{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;
  background:rgba(21,23,58,.7);border:3px solid var(--edge);font:700 22px var(--disp)}
#aBtn{right:18px;bottom:calc(62px + env(safe-area-inset-bottom,0px));color:var(--gold)}
#bBtn{right:96px;color:var(--teal)}
.abtn:active{background:var(--gold);color:var(--void)}

#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));padding:7px 14px;font-size:15px;white-space:nowrap;pointer-events:none;z-index:5}
body.touch #prompt{bottom:calc(182px + env(safe-area-inset-bottom,0px))}
kbd{font:inherit;font-size:.8em;background:var(--gold);color:var(--void);padding:1px 7px;border-radius:3px;margin-right:6px;box-shadow:0 2px 0 #9c6f12}
.ill{background:var(--void);border:2px solid var(--line);border-radius:6px;padding:8px;margin:16px 0 12px;display:flex;justify-content:center}
.ill canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%}
.illcap{margin:0;padding-left:1.2em}.illcap li{margin:4px 0;max-width:70ch}.illcap li::marker{content:"◆ ";color:var(--gold);font-size:.7em}
#toast{position:absolute;z-index:40;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:8px 16px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app">
  <canvas id="game" role="img" aria-label="Jeff Quest pixel world"></canvas>
  <div id="fade"></div>
  <div id="battle" hidden>
    <div class="win bbox" id="bMon"><div class="row2"><b id="bMonName"></b><span class="muted">Lv.??</span></div><div class="hp">HP<span><i id="bMonHp"></i></span></div></div>
    <div class="win bbox" id="bMe"><div class="row2"><b>Jeff</b><span class="muted">Lv.5</span></div><div class="hp">HP<span><i id="bMeHp"></i></span></div></div>
  </div>
  <div id="hud" hidden>
    <div id="loc" class="win"></div>
    <div class="hud-r">
      <button id="bBadges" class="chip" type="button"><span class="star">★</span> <span id="badgeCount">0</span>/7</button>
      <button id="bMusic" class="chip" type="button" aria-pressed="false" aria-label="Music">♪</button>
      <button id="bMenu" class="chip" type="button">MENU</button>
    </div>
  </div>
  <div id="dialog" class="win" hidden><div id="dName"></div><div id="dText"></div><div id="dChoices"></div><div id="dNext">▼</div></div>
  <div id="prompt" class="win" hidden></div>
  <div id="menu" class="win" hidden></div>
  <div id="ending" hidden><div id="endHead"></div><div id="endCard" class="win"></div></div>
  <div id="panel" hidden><div class="win panel-win" id="panelWin"><button class="x" type="button" id="panelX">✕ ESC</button><div id="panelBody"></div></div></div>
  <div id="title">
    <div class="title-card">
      <p class="eyebrow" id="tEyebrow">A PIXEL RÉSUMÉ</p>
      <h1 class="logo">JEFF<span>QUEST</span></h1>
      <p class="sub" id="tSub"></p>
      <div class="win title-menu" id="tMenu"></div>
      <div class="langsw"><button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">English</button></div>
      <p class="hint" id="tHint"></p>
    </div>
  </div>
  <div id="pad">
    <div id="dpad"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i></div>
    <button id="bBtn" class="abtn" type="button">B</button>
    <button id="aBtn" class="abtn" type="button">A</button>
  </div>
  <div id="toast" class="win"></div>
</div>

<script>
(()=>{
'use strict';
/* ================= basics ================= */
const T=16;
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
const $=s=>document.querySelector(s);
const isTouch=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window&&navigator.maxTouchPoints>0);
if(isTouch)document.body.classList.add('touch');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const Z=(zh,en)=>({zh,en});
let LANG=(navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en';
try{const l=localStorage.getItem('jq_lang');if(l==='zh'||l==='en')LANG=l;}catch(e){}
const tx=o=>o==null?'':(typeof o==='string'?o:(o[LANG]??o.zh));
const hash=(x,y,s=0)=>{let h=(x*374761393+y*668265263+s*982451653)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;};
const R=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h);};
const DV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const OPP={up:'down',down:'up',left:'right',right:'left'};

/* ================= 3x5 pixel font for signs ================= */
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110','.':'000000000000010','-':'000000111000000','!':'010010010000010','?':'110001010000010',':':'000010000010000','>':'100010001010100','<':'001010100010001','=':'000111000111000','+':'000010111010000','(':'010100100100010',')':'010001001001010','/':'001001010100100','|':'010010010010010',',':'000000000010100','#':'101111101111101','%':'101001010100101'};
function ptext(g,str,x,y,col,sc=1){g.fillStyle=col;x=Math.round(x);y=Math.round(y);let cx=x;for(const ch of str.toUpperCase()){const f=FONT[ch];if(f)for(let i=0;i<15;i++)if(f[i]==='1')g.fillRect(cx+(i%3)*sc,y+((i/3)|0)*sc,sc,sc);cx+=4*sc;}}
const ptw=(s,sc=1)=>s.length*4*sc-sc;

/* ================= sprites ================= */
function mk(rows,pal){const c=document.createElement('canvas');c.width=16;c.height=rows.length;const g=c.getContext('2d');
  rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const ch=r[x];if(ch!=='.'&&pal[ch]){g.fillStyle=pal[ch];g.fillRect(x,y,1,1);}}});return c;}
const mir=a=>a.map(h=>h+[...h].reverse().join(''));
const flip=a=>a.map(r=>[...r].reverse().join(''));
const setc=(rows,y,x,ch)=>{rows[y]=rows[y].slice(0,x)+ch+rows[y].slice(x+1);};
const HEAD_D=mir(["........",".....ooo","....ohhh","...ohhhh","...ohhhh","...ohsss","...ohses","...ohsss","....osss"]);
const HEAD_U=mir(["........",".....ooo","....ohhh","...ohhhh","...ohhhh","...ohhhh","...ohhhh","...ohhhh","....ohhh"]);
const BODY_D=mir(["...occcc","..occccc","..oscccc"]);
const LEG_D={s:["...oppppppppo...","...oppo..oppo...","...okko..okko...","....oo....oo...."],

function buildWorld(){
  const W=100,H=32;
  const g=[...Array(H)].map(()=>Array(W).fill('g'));
  const res=[...Array(H)].map(()=>Array(W).fill(false));
  const fill=(x,y,w,h,c,rv=true)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++){if(i<0||j<0||i>=W||j>=H)continue;g[j][i]=c;if(rv)res[j][i]=true;}};
  const reserve=(x,y,w,h)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(i>=0&&j>=0&&i<W&&j<H)res[j][i]=true;};
  fill(68,0,W-68,H,'S',false);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(x<2||x>=W-2||y<2||y>=H-2)g[y][x]=x>=68?'P':'T';
  fill(64,0,4,H,'w');
  fill(2,18,62,2,'p');fill(64,18,4,2,'b');fill(68,18,28,2,'r');
  reserve(0,16,W,6);
  for(const b of BUILDINGS){reserve(b.x-1,b.y-1,b.w+2,b.h+2);if(b.x<64)fill(b.door,16,1,2,'p');}
  // pond + park
  fill(5,23,7,4,'w');for(const [x,y] of [[5,23],[11,23],[5,26],[11,26]])g[y][x]='g';reserve(4,22,9,6);
  fill(17,16,3,1,'f');fill(23,16,3,1,'f');
  reserve(13,22,14,5);reserve(58,21,6,4);reserve(69,20,28,6);
  for(const x of[13,29,41,53])g[17][x]='L';for(const x of[79,92])g[17][x]='L';
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(res[y][x])continue;const r=hash(x,y,7);
    if(g[y][x]==='g'){if(r<.08)g[y][x]='T';else if(r<.13)g[y][x]='f';else if(r<.25)g[y][x]='G';}
    else if(g[y][x]==='S'&&x>69){if(r<.06)g[y][x]='P';}
  }
  return g.map(r=>r.join(''));
}

  for(let y=0;y<M.h;y++)for(let x=0;x<M.w;x++)if(SOL.includes(M.grid[y][x]))M.solid[y][x]=true;
  for(const b of M.buildings)for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++)if(!(x===b.door&&y===b.y+b.h-1))M.solid[y][x]=true;
  if(id==='world'&&S.mirror)M.objs.find(o=>o.k==='shard').gone=1;
  for(const o of M.objs){if(o.gone)continue;for(let y=o.y;y<o.y+o.h;y++)for(let x=o.x;x<o.x+o.w;x++){if(o.k!=='clock'){M.solid[y][x]=true;}M.objAt[y][x]=o;}}

  return M;
}

function buildSong(){const ev=[];let pos=0;
  for(const k of ORDER){const sc=SEC[k];const bars=sc.m.split('|'),chs=sc.c.split(' ');
    bars.forEach((bar,bi)=>{let q=pos+bi*6;for(const tok of bar.trim().split(/\s+/)){const[n,d]=tok.split(':');if(n!=='R')ev.push({s:q,m:midi(n),d:+d,k:'m'});q+=+d;}

    pos+=bars.length*6;}
  ev.sort((x,y)=>x.s-y.s);return{ev,len:pos};}

function pulseWave(a,duty){const n=24,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*duty);return a.createPeriodicWave(re,im);}
function mnote(e,t){const a=AC;const o=a.createOscillator(),gn=a.createGain();o.frequency.value=mf(e.m);const dur=e.d*E8;

  else{o.type='triangle';gn.gain.setValueAtTime(.032,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);}
  o.connect(gn);gn.connect(mG);o.start(t);o.stop(t+dur+.35);}

  for(let guard=0;guard<300;guard++){if(mIdx>=SONG.ev.length){mIdx=0;mLoop++;}const e=SONG.ev[mIdx];const t=mStart+(mLoop*SONG.len+e.s)*E8;if(t>ahead)break;if(t>AC.currentTime-.02)mnote(e,t);mIdx++;}}

}

let scriptBusy=false;
async function run(steps){if(scriptBusy)return;scriptBusy=true;try{await runSteps(steps);}finally{hideDialog();scriptBusy=false;}}
async function runSteps(steps){
  for(const st of steps){
    if(st.t)await showLine(st.n,st.t);
    else if(st.badge)await giveBadge(st.badge);
    else if(st.panel){hideDialog();await openPanel(st.panel);}
    else if(st.choice){const i=await showChoice(st.n,st.q,st.choice);const br=st.then&&st.then[i];if(br&&br.length)await runSteps(br);}
    else if(st.fn){await FN[st.fn](st.arg);}
  }
}

/* ================= movement / world logic ================= */
function npcAt(M,x,y,self){return M.npcs.find(n=>n!==self&&((n.x===x&&n.y===y)||(n.moving&&n.fx===x&&n.fy===y)));}
function blocked(M,x,y,self){
  if(x<0||y<0||x>=M.w||y>=M.h)return true;
  if(M.solid[y][x])return true;
  if(npcAt(M,x,y,self))return true;
  if(self!==P&&((P.x===x&&P.y===y)||(P.fx===x&&P.fy===y)))return true;
  if(self!==P&&self!==C&&self!==C2&&((C.x===x&&C.y===y)||(S.mirror&&C2.x===x&&C2.y===y)||isWarp(M,x,y)))return true;
  return false;
}
function isWarp(M,x,y){if(M.id==='world')return M.buildings.some(b=>b.door===x&&b.y+b.h-1===y);return M.grid[y][x]==='D';}
function startMove(e,d,dur){const[dx,dy]=DV[d];e.fx=e.x;e.fy=e.y;e.x+=dx;e.y+=dy;e.t=0;e.moving=true;e.dir=d;e.dur=dur;e.step++;}
let bumpT=0;
function tryStep(d){
  const M=cur();const[dx,dy]=DV[d];const nx=P.x+dx,ny=P.y+dy;P.dir=d;
  if(blocked(M,nx,ny,P)){if(bumpT<=0){sfx.bump();bumpT=.35;S.bumps++;bumpTalk();}return;}
  const ox=P.x,oy=P.y,cox=C.x,coy=C.y;const dur=running()?.09:.16;startMove(P,d,dur);
  // corgi follows into the player's previous tile
  if(C.x!==ox||C.y!==oy){const cdx=ox-C.x,cdy=oy-C.y;if(Math.abs(cdx)+Math.abs(cdy)===1){startMove(C,cdx>0?'right':cdx<0?'left':cdy>0?'down':'up',dur);}else{C.x=C.fx=ox;C.y=C.fy=oy;}}
  // ...and the mirrored corgi follows the first one
  if(S.mirror&&(C.x!==cox||C.y!==coy)&&(C2.x!==cox||C2.y!==coy)){const ddx=cox-C2.x,ddy=coy-C2.y;
    if(Math.abs(ddx)+Math.abs(ddy)===1)startMove(C2,ddx>0?'right':ddx<0?'left':ddy>0?'down':'up',dur);else{C2.x=C2.fx=cox;C2.y=C2.fy=coy;C2.moving=false;}}
}
function advance(e,dt){if(!e.moving)return false;e.t+=dt/e.dur;if(e.t>=1){e.t=0;e.moving=false;e.fx=e.x;e.fy=e.y;return true;}return false;}

async function warp(to,px,py,dir){

  S.map=to;if(!MAPS[to])MAPS[to]=makeMap(to);
  P.x=P.fx=px;P.y=P.fy=py;P.dir=dir;P.moving=false;
  const back=DV[OPP[dir]];C.x=C.fx=px+back[0];C.y=C.fy=py+back[1];C.moving=false;
  C2.x=C2.fx=C.x;C2.y=C2.fy=C.y;C2.moving=false;
  if(to==='world'){S.zone=-1;checkZone();}else{S.visited.add(to);S.zone=0;showLoc(INAME[to]);}
  fade(false);await wait(reduced?0:120);fading=false;
}
function onArrive(){

  else if(M.grid[P.y][P.x]==='D'){const b=BUILDINGS.find(b=>b.id===M.id);warp('world',b.door,b.y+b.h,'down');}
}

const KN={tv:Z('電視','TV'),pc:Z('電腦','Computer'),bookshelf:Z('書櫃','Bookshelf'),window:Z('窗戶','Window'),mirror:Z('鏡子','Mirror'),bed:Z('床','Bed'),table:Z('桌子','Table'),globe:Z('地球儀','Globe'),plant:Z('盆栽','Plant'),blackboard:Z('黑板','Blackboard'),poster:Z('海報','Poster'),diploma:Z('畢業證書','Diplomas'),desk:Z('課桌','Desk'),whiteboard:Z('白板','Whiteboard'),binders:Z('文件櫃','Binders'),screen:Z('大螢幕','Big screen'),phone:Z('手機展示台','Phone display'),abboard:Z('A/B 白板','A/B board'),server:Z('伺服器','Servers'),scroll:Z('卷軸','Scroll'),banner:Z('掛軸','Hanging scroll'),flag:Z('導遊旗','Tour flag'),rack:Z('行程 DM','Brochures'),mapwall:Z('地圖','Map'),counter:Z('櫃檯','Counter'),sofa:Z('沙發','Sofa'),mic:Z('麥克風','Microphone'),sign:Z('告示牌','Sign'),bench:Z('長椅','Bench'),bike:Z('機車','Scooter'),cart:Z('咖啡攤','Coffee cart'),stall:Z('水果攤','Fruit stall'),gate:Z('NEXT STAGE 大門','NEXT STAGE gate'),bush:Z('草叢','Tall grass'),pond:Z('池塘','Pond'),fishspot:Z('釣魚點','Fishing spot'),shard:Z('發光的東西','Something shiny')};
const TOPOFF={tv:-4,pc:-6,bookshelf:-8,binders:-6,phone:-6,abboard:-6,server:-4,flag:-6,cart:-8,stall:-8,gate:-12};
function facing(){
  const M=cur();const[dx,dy]=DV[P.dir];const fx=P.x+dx,fy=P.y+dy;
  if(C.x===fx&&C.y===fy&&!C.moving)return{kind:'corgi'};
  if(S.mirror&&C2.x===fx&&C2.y===fy&&!C2.moving)return{kind:'corgi',e:C2};
  const n=M.npcs.find(n=>n.x===fx&&n.y===fy);if(n)return{kind:'npc',n};
  if(fx>=0&&fy>=0&&fx<M.w&&fy<M.h){const o=M.objAt[fy][fx];if(o&&o.s)return{kind:'obj',o};}

}
const objKey=(M,o)=>M.id+'#'+M.objs.indexOf(o), npcKey=(M,n)=>M.id+'@'+n.id;
function interact(){

  if(f.kind==='npc'){f.n.dir=OPP[P.dir];S.seen.add(npcKey(M,f.n));save();run(resolveScript(f.n.s));return;}

function sparkle(x,y,now,seed){const ph=(now/130+seed*11)%9;if(ph>5)return;const st=ph<1||ph>4?0:(ph<2||ph>3?1:2);
  R(ctx,x,y,1,1,'#ffffff');if(st>=1){R(ctx,x-1,y,3,1,'#fff6c8');R(ctx,x,y-1,1,3,'#fff6c8');R(ctx,x,y,1,1,'#ffffff');}
  if(st>=2){R(ctx,x-3,y,1,1,'#f2c14e');R(ctx,x+3,y,1,1,'#f2c14e');R(ctx,x,y-3,1,1,'#f2c14e');R(ctx,x,y+3,1,1,'#f2c14e');R(ctx,x-2,y,1,1,'#fff6c8');R(ctx,x+2,y,1,1,'#fff6c8');R(ctx,x,y-2,1,1,'#fff6c8');R(ctx,x,y+2,1,1,'#fff6c8');}}
function bubble(x,y,now){const b=Math.floor(now/420)%2;const X=x+9,Y=y-16-b;R(ctx,X-1,Y-1,13,9,'#1d1726');R(ctx,X,Y,11,7,'#f4efe3');R(ctx,X+1,Y+8,3,1,'#1d1726');R(ctx,X+1,Y+7,2,1,'#f4efe3');
  const d=1+Math.floor(now/320)%3;for(let i=0;i<d;i++)R(ctx,X+2+i*3,Y+3,2,2,'#1d1726');}
function brackets(x,y,w,h,now){const p=Math.floor(now/260)%2;x-=2+p;y-=2+p;w+=4+2*p;h+=4+2*p;
  for(const [c,o] of [['#1d1726',1],['#ffffff',0]]){const X=x+o,Y=y+o;
    R(ctx,X,Y,5,1,c);R(ctx,X,Y,1,5,c);R(ctx,X+w-5,Y,5,1,c);R(ctx,X+w-1,Y,1,5,c);
    R(ctx,X,Y+h-1,5,1,c);R(ctx,X,Y+h-5,1,5,c);R(ctx,X+w-5,Y+h-1,5,1,c);R(ctx,X+w-1,Y+h-5,1,5,c);}}

function renderEnding(now){

  R(ctx,0,0,CW,CH_,'#0b0c1c');
  // parallax stars, far to near
  [[1.2,6,1,'#3b3f7a'],[.6,18,1,'#aeb0d4'],[.15,60,3,'#f4efe3']].forEach(([dens,sp,len,c],L)=>{

  await showLine(null,line);

  if(S.fish===10)await showLine(null,Z('（第 10 次了。每次都用 0.05 當門檻的話，至少釣到一條假顯著的機率已經超過 40%。）','(Cast number 10. At a 0.05 threshold each time, the odds of at least one false positive are now over 40%.)'));};

// 7 · the old man's secret
function oldmanScript(){const n=++S.old;
  if(n===1)return[say('oldman','別急著往東衝。每棟房子都進得去，裡面的東西大多能調查。',"Don't rush east. Every building has a door, and most things inside can be inspected."),
    say('oldman',isTouch?'走累了就按住 B 跑步。':'走累了就按住 Shift 跑步。',isTouch?'Tired? Hold B to run.':'Tired? Hold Shift to run.')];
  if(n===2)return[say('oldman','又是你啊。每棟房子都進去看過了嗎？','You again. Been inside every building yet?')];
  if(n===3)return[say('oldman','……你身邊那隻柯基，看起來好眼熟。','...That corgi of yours looks awfully familiar.')];
  if(n===4)return[say('oldman','我年輕的時候也養過一隻柯基。牠也很愛跟在人後面跑。','I had a corgi when I was young. It loved following people around too.')];
  if(n===5)return[say('oldman','……好吧，被你發現了。','...Fine. You got me.'),say('futurejeff','我其實是從未來回來的 Jeff。','I’m actually Jeff, back from the future.'),
    say('futurejeff','未來的事不能說太多。只能告訴你：多喝水、記得存檔、柯基要好好照顧。','I can’t say much about the future. Just: drink water, save often, and take good care of the corgi.'),
    say('corgi','……難怪你身上有我的味道。','...That explains why you smell like me.')];
  const tips=[Z('遇到 NULL 值，先查為什麼缺，再決定怎麼補。','When you meet a NULL, find out why it’s missing before you fill it.'),
    Z('報告寫短一點。高層真的只看第一頁。','Keep reports short. Execs really do only read page one.'),
    Z('柯基後來……算了，這是劇透。','The corgi later... never mind. Spoilers.'),
    Z('p = 0.049 的時候，先別急著開心。','When you see p = 0.049, hold the celebration.')];
  return[say('futurejeff',tips[(n-6)%tips.length].zh,tips[(n-6)%tips.length].en)];
}

// 8 · wall-bump statistics
function bumpTalk(){const L={20:Z('你已經撞牆 20 次了。這個樣本數，差不多可以做檢定了。','That’s 20 wall bumps. Big enough sample for a test, probably.'),
  50:Z('撞牆 50 次。結論：牆壁顯著地存在（p < 0.001）。','50 bumps. Conclusion: the wall significantly exists (p < 0.001).'),
  100:Z('100 次了……你是在幫這面牆做壓力測試嗎？','100 times... Are you stress-testing this wall?')}[S.bumps];
  if(L)setTimeout(()=>run([say('corgi',L.zh,L.en)]),150);}
function running(){return keys.has('ShiftLeft')||keys.has('ShiftRight')||padB;}

/* ================= input ================= */
const keys=new Set();let dirStack=[];let padDir=null,padB=false;
const DIRK={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{
  if(PN){if(e.code==='Escape'||e.code==='KeyX'||e.code==='Backspace'){e.preventDefault();closePanel();}return;}
  if(S.mode==='ending'){
    const dd=DIRK[e.code];
    if(dd){e.preventDefault();const bs=[...endEl.querySelectorAll('button,a')],n=bs.length,i=bs.indexOf(document.activeElement);
      bs[(i<0?0:i+(dd==='right'||dd==='down'?1:-1)+n)%n].focus({preventScroll:true});sfx.sel();}
    else if((e.code==='Escape'||e.code==='KeyX'||e.code==='KeyM')&&!fading)leaveEnding(false);
    return;}
  const d=DIRK[e.code];
  if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();
  if(d){
    if(S.mode==='title'){if(d==='up'||d==='down'){const n=titleItems().length;TM.sel=(TM.sel+(d==='down'?1:-1)+n)%n;renderTitleMenu();sfx.sel();}return;}
    if(MN){if(d==='up'||d==='down'){MN.sel=(MN.sel+(d==='down'?1:-1)+MENU_ITEMS.length)%MENU_ITEMS.length;renderMenu();sfx.sel();}return;}
    if(CH){if(d==='up'||d==='down'){CH.sel=(CH.sel+(d==='down'?1:-1)+CH.opts.length)%CH.opts.length;renderChoicesSel();sfx.sel();}return;}
    if(!dirStack.includes(d))dirStack.push(d);
  }
  keys.add(e.code);
  if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='KeyZ'){if(document.activeElement&&document.activeElement.tagName==='BUTTON')e.preventDefault();pressA();}
  else if(e.code==='Escape'||e.code==='KeyX'||e.code==='KeyM')pressB();
});
addEventListener('keyup',e=>{keys.delete(e.code);const d=DIRK[e.code];if(d)dirStack=dirStack.filter(x=>x!==d);});
addEventListener('blur',()=>{keys.clear();dirStack=[];padDir=null;padB=false;});
function heldDir(){return padDir||dirStack[dirStack.length-1]||null;}
function pressA(){
  if(PN)return;
  if(S.mode==='title'){titlePick(TM.sel);return;}
  if(MN){menuPick(MN.sel);return;}
  if(CH){CH.resolve(CH.sel);return;}
  if(W8){if(!W8.full)W8.finish();else W8.resolve();return;}
  if(canMove()&&!P.moving)interact();
}
function pressB(){
  if(PN){closePanel();return;}
  if(MN){closeMenu();return;}
  if(CH){CH.resolve(CH.opts.length-1);return;}
  if(W8){pressA();return;}
  if(S.mode==='play'&&!scriptBusy)openMenu();
}
function canMove(){return S.mode==='play'&&!scriptBusy&&!MN&&!PN&&!fading;}
// touch pad
const dpad=$('#dpad');
function padFrom(e){const r=dpad.getBoundingClientRect();const x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;if(Math.hypot(x,y)<12)return null;return Math.abs(x)>Math.abs(y)?(x>0?'right':'left'):(y>0?'down':'up');}
function setPad(d){
  if(MN&&d&&d!==padDir&&(d==='up'||d==='down')){MN.sel=(MN.sel+(d==='down'?1:-1)+MENU_ITEMS.length)%MENU_ITEMS.length;renderMenu();}
  if(CH&&d&&d!==padDir&&(d==='up'||d==='down')){CH.sel=(CH.sel+(d==='down'?1:-1)+CH.opts.length)%CH.opts.length;renderChoicesSel();}
  padDir=d;dpad.querySelectorAll('i').forEach(i=>i.classList.toggle('on',d&&i.classList.contains(d[0])));}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();dpad.setPointerCapture(e.pointerId);setPad(padFrom(e));});
dpad.addEventListener('pointermove',e=>{if(dpad.hasPointerCapture(e.pointerId))setPad(padFrom(e));});
for(const ev of['pointerup','pointercancel','lostpointercapture'])dpad.addEventListener(ev,()=>setPad(null));
$('#aBtn').addEventListener('pointerdown',e=>{e.preventDefault();audio();pressA();});
$('#bBtn').addEventListener('pointerdown',e=>{e.preventDefault();padB=true;if(!canMove()||MN)pressB();});
for(const ev of['pointerup','pointercancel','pointerleave'])$('#bBtn').addEventListener(ev,()=>padB=false);

/* ================= game flow ================= */
function goTitle(){
  closeMenu(true);hideDialog();S.mode='title';$('#hud').hidden=true;$('#pad').classList.remove('on');$('#prompt').hidden=true;lastPrompt='';
  $('#title').hidden=false;TM.sel=0;TM.confirm=false;renderTitleMenu();sfx.sel();
}
function startGame(){
  try{document.activeElement&&document.activeElement.blur();}catch(e){}
  S.mode='play';if(!S.t0)S.t0=performance.now();$('#title').hidden=true;$('#hud').hidden=false;$('#pad').classList.add('on');
  updateHUD();sfx.ok();S.zone=-1;if(S.map==='world')checkZone();else{S.zone=0;showLoc(INAME[S.map]);}
  if(S.music&&!mG)setMusic(true);
  if(!S.intro){S.intro=true;save();setTimeout(()=>run([
    say('corgi','汪！你醒啦。這裡是 Jeff 的世界。','Woof! You’re up. Welcome to Jeff’s world.'),
    say('corgi','這座小鎮照著他的人生排好了：往東走，就是往未來走。','This town is laid out along his life. Walk east, and you walk forward in time.'),
    say('corgi','每個地方都藏著一枚徽章。集滿 7 枚，最東邊的大門會為你打開。','Every place hides a badge. Collect all 7 and the gate in the far east opens for you.'),
    say('corgi',isTouch?'用左下方向鍵移動，A 調查，右上角有選單。我會一直跟著你。':'方向鍵移動、空白鍵調查、Esc 開選單。我會一直跟著你。',isTouch?'Use the D-pad to move and A to inspect. The menu is top right. I’ll follow you.':'Arrow keys to move, Space to inspect, Esc for the menu. I’ll follow you.'),
    say('corgi','先進家裡看看吧，門就在你正上方。','Start with the house. The door is right above you.'),
  ]),350);}
}

/* ================= render ================= */
let SCALE=3,CW=320,CH_=200;
function resize(){
  const w=innerWidth,h=innerHeight;
  SCALE=Math.max(2,Math.min(6,Math.floor(Math.min(w/(T*18),h/(T*11)))));
  if(w<520)SCALE=2;
  CW=Math.ceil(w/SCALE);CH_=Math.ceil(h/SCALE);cv.width=CW;cv.height=CH_;cv.style.width=CW*SCALE+'px';cv.style.height=CH_*SCALE+'px';ctx.imageSmoothingEnabled=false;
}
addEventListener('resize',()=>{resize();const c=$('#illCv');if(c)sizeIll(c);});
const epos=e=>{const k=e.moving?e.t:0;return[Math.round((e.fx+(e.x-e.fx)*k)*T),Math.round((e.fy+(e.y-e.fy)*k)*T)];};
function drawChar(e,spr,cx,cy){
  const[px,py]=epos(e);const X=px-cx,Y=py-cy;
  if(X<-20||Y<-24||X>CW+4||Y>CH_+4)return;
  ctx.fillStyle='rgba(20,15,30,.28)';ctx.fillRect(X+3,Y+13,10,3);ctx.fillRect(X+4,Y+12,8,1);
  const fr=spr[e.dir]||spr.down;let i=0;if(e.moving)i=e.t<.5?(e.step%2?1:3):0;
  ctx.drawImage(fr[i],X,Y-4);
}
function drawCorgi(e,cx,cy,now){const[px,py]=epos(e);const X=px-cx,Y=py-cy;ctx.fillStyle='rgba(20,15,30,.28)';ctx.fillRect(X+3,Y+13,11,2);
  const d=e.dir==='left'?'left':e.dir==='right'?'right':(e.lastH||'right');if(e.dir==='left'||e.dir==='right')e.lastH=e.dir;
  const fr=(S.cyber?CORGI_CY:CORGI)[d][e.moving&&e.t<.5?1:0];ctx.drawImage(fr,X,Y-1);
  if(S.cyber&&Math.floor(now/300)%2)R(ctx,X+(d==='right'?1:14),Y+8,1,1,'#5ff2ff');}
function marker(x,y,t){const b=Math.round(Math.sin(t/180)*1.5);R(ctx,x+5,y-14+b,6,8,'#f4efe3');R(ctx,x+4,y-13+b,8,6,'#f4efe3');R(ctx,x+7,y-12+b,2,3,'#e0a21c');R(ctx,x+7,y-8+b,2,1,'#e0a21c');R(ctx,x+7,y-6+b,2,1,'#f4efe3');}
function render(now){
  if(S.mode==='ending'){renderEnding(now);return;}
  if(BT){renderBattle(now);return;}
  const M=S.mode==='title'?MAPS.world:cur();ctx.fillStyle='#0b0c1c';ctx.fillRect(0,0,CW,CH_);
  let cx,cy;const mw=M.w*T,mh=M.h*T;
  if(S.mode==='title'){const span=mw-CW;cx=span>0?Math.round((Math.sin(now/9000)*.5+.5)*span):Math.round((mw-CW)/2);cy=Math.round(Math.min(Math.max(18.5*T-CH_/2,0),Math.max(0,mh-CH_)));if(mh<CH_)cy=Math.round((mh-CH_)/2);}
  else{const[px,py]=epos(P);cx=mw<=CW?Math.round((mw-CW)/2):Math.round(Math.min(Math.max(px+8-CW/2,0),mw-CW));cy=mh<=CH_?Math.round((mh-CH_)/2):Math.round(Math.min(Math.max(py+8-CH_/2,0),mh-CH_));}
  ctx.drawImage(M.layer,-cx,-cy);
  // animated bits
  const x0=Math.max(0,Math.floor(cx/T)),y0=Math.max(0,Math.floor(cy/T)),x1=Math.min(M.w,Math.ceil((cx+CW)/T)+1),y1=Math.min(M.h,Math.ceil((cy+CH_)/T)+1);
  if(M.id==='world'){
    for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++)if(M.grid[y][x]==='w'){const ph=((now/700+hash(x,y,9)*4)%4);const ox=(ph*4)|0;R(ctx,x*T-cx+ox+1,y*T-cy+4,4,1,'#9fd0f0');R(ctx,x*T-cx+((ox+8)%14),y*T-cy+10,3,1,'#9fd0f0');}
    const tw=M.buildings[4];const tcx=tw.x*T+tw.w*T/2-cx,tty=tw.y*T-6-cy;R(ctx,tcx-1,tty-1,2,2,(now%1200)<600?'#ff4d4d':'#7a1d1d');
    for(let k=0;k<2;k++){const r=((now/90+k*7)%14)+3;const a=1-r/17;ctx.fillStyle=`rgba(159,208,240,${a.toFixed(2)})`;for(const s of[-1,1])for(let j=-2;j<=2;j++){ctx.fillRect(Math.round(tcx+s*r*Math.cos(j*.3)),Math.round(tty+2+r*Math.sin(j*.3)),1,1);}}
    const kb=M.buildings[6];const kc=(Math.floor(now/500)%3===2)?'#5ff2ff':'#ff5fa2';const kx=kb.x*T+kb.w*T/2-ptw('KTV',3)/2-cx,ky=kb.y*T+19-cy;
    if(!((now%3100)>3000))ptext(ctx,'KTV',kx,ky,kc,3);
    const gt=M.objs.find(o=>o.k==='gate');const gx=gt.x*T-cx,gy=gt.y*T-cy;const all=S.badges.size>=7;
    for(let i=0;i<19;i++){const v=(i*2+now/60)%38;const col=all?(i%2?'#f2c14e':'#fff2b8'):(i%2?'#3fb6a8':'#2a5a78');R(ctx,gx+4,gy-6+Math.floor(v),8,1,col);}
  }
  if(M.id==='world'&&S.bloom)drawBloom(now,cx,cy);
  // entities
  const list=M.npcs.map(n=>({y:epos(n)[1],f:()=>drawChar(n,SPR[n.id],cx,cy)}));
  if(M===cur()){list.push({y:epos(C)[1]-1,f:()=>drawCorgi(C,cx,cy,now)},{y:epos(P)[1],f:()=>drawChar(P,SPR.jeff,cx,cy)});
    if(S.mirror)list.push({y:epos(C2)[1]-1,f:()=>drawCorgi(C2,cx,cy,now)});}
  list.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
  if(LOOT&&M.id==='world')drawLoot(now,cx,cy);
  if(SING&&M.id==='ktv')drawStageLights(now,M,cx,cy);
  if(S.mode==='play'){
    M.objs.forEach((o,i)=>{if(!o.s||o.gone||S.seen.has(M.id+'#'+i))return;if(o.badge&&!S.badges.has(o.badge))return;sparkle(o.x*T+o.w*T-4-cx,o.y*T+(TOPOFF[o.k]||0)-cy,now,hash(o.x,o.y,3));});
    for(const n of M.npcs){const[px,py]=epos(n);if(n.badge&&!S.badges.has(n.badge))marker(px-cx,py-cy,now);else if(!S.seen.has(M.id+'@'+n.id))bubble(px-cx,py-cy,now);}
    for(const o of M.objs)if(o.badge&&!S.badges.has(o.badge))marker(o.x*T-cx,o.y*T-cy+10,now);
    if(canMove()&&!P.moving){const f=facing();if(f){
      if(f.kind==='obj'){const o=f.o,to=TOPOFF[o.k]||0;brackets(o.x*T-cx,o.y*T+to-cy,o.w*T,o.h*T-to,now);}
      else{const e=f.kind==='npc'?f.n:(f.e||C);const[px,py]=epos(e);brackets(px-cx,py-cy-(f.kind==='npc'?5:0),16,f.kind==='npc'?21:16,now);}}}
  }
}
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;bumpT-=dt;
  if(S.mode==='play'){
    const M=cur();
    if(advance(P,dt))onArrive();
    advance(C,dt);if(S.mirror)advance(C2,dt);
    if(!P.moving&&canMove()){
      const d=heldDir();
      if(d){if(P.dir!==d&&!P.walking){P.dir=d;P.turn=.08;}else if((P.turn=(P.turn||0)-dt)<=0){P.walking=true;tryStep(d);}}
      else P.walking=false;
    }
    for(const n of M.npcs){advance(n,dt);if(n.wander&&!n.moving&&canMove()){n.wt-=dt;if(n.wt<=0){n.wt=1.6+Math.random()*2.6;const ds=['up','down','left','right'];const d=ds[(Math.random()*4)|0];const[dx,dy]=DV[d];const nx=n.x+dx,ny=n.y+dy;n.dir=d;if(Math.abs(nx-n.ox)<=2&&Math.abs(ny-n.oy)<=1&&!blocked(M,nx,ny,n))startMove(n,d,.28);}}}
  }
  updatePrompt();render(now);requestAnimationFrame(loop);
}

/* ================= boot ================= */
function boot(data){
  load();if(data&&Array.isArray(data.badges))data.badges.forEach(b=>S.badges.add(b));
  MAPS.world=makeMap('world');
  document.documentElement.lang=LANG==='zh'?'zh-Hant':'en';
  resize();applyI18n();updateHUD();
  requestAnimationFrame(loop);
}
try{window.claude?.hot?.snapshot?.(()=>({badges:[...S.badges]}));}catch(e){}
const H=window.claude?.hot;
if(H&&typeof H.ready==='function')H.ready(boot);else boot(H?.data??{});
})();
